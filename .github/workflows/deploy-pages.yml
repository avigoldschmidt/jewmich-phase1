name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Production is served from the gh-pages branch (Settings → Pages → Deploy from a
# branch → gh-pages / (root)). actions/deploy-pages only works with the GitHub
# Actions source, so main publishes via JamesIves and preserves pr/ previews.
permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Publish site root to gh-pages (keep pr/)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: |
            pr
          commit-message: 'Deploy main (${{ github.sha }})'

      - name: Request Pages rebuild
        continue-on-error: true
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
