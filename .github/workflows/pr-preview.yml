name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# Same-repo PRs only — fork PRs cannot push to gh-pages with the default token.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build PR preview
        run: |
          touch public/.nojekyll
          npm run build
        env:
          GITHUB_PAGES: 'true'
          BASE_URL: /jewmich-phase1/pr/${{ github.event.pull_request.number }}

      - name: Deploy to gh-pages/pr/<n>
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: pr/${{ github.event.pull_request.number }}
          clean: true
          commit-message: 'Preview PR #${{ github.event.pull_request.number }} (${{ github.sha }})'

      - name: Request Pages rebuild
        continue-on-error: true
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sticky preview comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            ### PR preview

            **https://avigoldschmidt.github.io/jewmich-phase1/pr/${{ github.event.pull_request.number }}/**

            Built from `${{ github.event.pull_request.head.sha }}` with Astro `base` `/jewmich-phase1/pr/${{ github.event.pull_request.number }}`.

            Requires Pages source **Deploy from a branch → `gh-pages` / `(root)`** (production + previews share that branch).

  remove-preview:
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Empty dir for cleanup
        run: echo "empty_dir=$(mktemp -d)" >> "$GITHUB_ENV"

      - name: Remove gh-pages/pr/<n>
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ${{ env.empty_dir }}
          target-folder: pr/${{ github.event.pull_request.number }}
          clean: true
          commit-message: 'Remove preview for PR #${{ github.event.pull_request.number }}'

      - name: Update sticky comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            ### PR preview

            Preview for this PR was removed from `gh-pages` (`pr/${{ github.event.pull_request.number }}/`) after the PR closed.
